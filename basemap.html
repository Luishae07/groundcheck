<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Map — Groundcheck</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0a0c11;}
  #map{position:absolute;top:0;bottom:0;width:100%;}
  .back{
    position:absolute; top:14px; left:14px; z-index:10;
    background:rgba(20,24,33,0.85); color:#eef1f7; text-decoration:none;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:10px; backdrop-filter:blur(6px);
  }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Groundcheck</a>
<div id="map"></div>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://washing-alarm-expect-springs.trycloudflare.com/styles/osm-bright/style.json',
    center: [10, 50],
    zoom: 5,
    minZoom: 4,
    maxZoom: 8
  });
  map.addControl(new maplibregl.NavigationControl());
</script>
</body>
</html>
