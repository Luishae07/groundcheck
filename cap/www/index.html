<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groundcheck</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0c11}
  .wrap{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; font-family:-apple-system,system-ui,sans-serif;
  }
  .icon{
    width:88px; height:88px; border-radius:22px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(0.94); opacity:0.75; }
  }
  .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.15); border-top-color:#5fcf95;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <img class="icon" src="app-icon-240.png" alt="">
  <div class="spinner"></div>
</div>
<script>
  // iPadOS reports itself as a Mac in its user agent string (since iPadOS
  // 13), so the reliable way to detect a real iPad vs. a Mac is checking
  // for touch support alongside the Mac-like UA — a Mac has no touch
  // points, an iPad in desktop mode does.
  var ua = navigator.userAgent;
  var isIPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  window.location.replace(isIPad ? 'desktop.html' : 'mobile.html');
</script>
</body>
</html>
