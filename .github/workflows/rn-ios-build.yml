name: Build iOS App (React Native)

on:
  push:
    paths:
      - 'rn/**'
      - '.github/workflows/rn-ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Scaffold a fresh bare React Native project — this generates the
      # native ios/ folder (Podfile, .xcodeproj) that a hand-written repo
      # doesn't carry, since CocoaPods/Xcode project generation only really
      # works on macOS. Our actual app code (rn/src, rn/package.json) is
      # injected into this scaffold afterward.
      - name: Scaffold React Native project
        run: npx react-native@0.87.1 init GroundcheckRN --directory scaffold --pm npm --skip-install true

      - name: Inject app source
        run: |
          rm -rf scaffold/src
          cp -R rn/src scaffold/src
          node -e "
            const fs = require('fs');
            const base = JSON.parse(fs.readFileSync('scaffold/package.json'));
            const ours = JSON.parse(fs.readFileSync('rn/package.json'));
            base.dependencies = { ...base.dependencies, ...ours.dependencies };
            fs.writeFileSync('scaffold/package.json', JSON.stringify(base, null, 2));
          "
          printf "import {AppRegistry} from 'react-native';\nimport App from './src/App';\nimport {name as appName} from './app.json';\nAppRegistry.registerComponent(appName, () => App);\n" > scaffold/index.js

      - name: npm install
        working-directory: scaffold
        run: npm install

      - name: pod install
        working-directory: scaffold/ios
        run: pod install

      # Real device target, unsigned — iLoader/AltStore-style sideloading
      # tools do their own signing on install, so no Apple Developer
      # certificate is needed in CI.
      - name: Build (Release, device, no code signing)
        working-directory: scaffold/ios
        run: |
          xcodebuild build \
            -workspace GroundcheckRN.xcworkspace \
            -scheme GroundcheckRN \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        working-directory: scaffold/ios
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r GroundcheckRN.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Groundcheck-iOS-RN
          path: scaffold/ios/GroundcheckRN.ipa
          retention-days: 30
