<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groundcheck Changelog</title>
<meta name="description" content="Changelog for Groundcheck — release notes and updates for the live weather and radiosonde data map and API.">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f6f9; --panel:#ffffff; --ink:#132433; --ink-dim:#5b7185;
  --line:#dbe4ec; --accent:#1f6f4a; --code-bg:#0d1b2e; --code-ink:#d8e6f2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1620; --panel:#111c28; --ink:#e8eef4; --ink-dim:#8fa3b8;
    --line:#22323f; --accent:#5fcf95; --code-bg:#080f18; --code-ink:#c9dcec;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1620; --panel:#111c28; --ink:#e8eef4; --ink-dim:#8fa3b8;
  --line:#22323f; --accent:#5fcf95; --code-bg:#080f18; --code-ink:#c9dcec;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter",system-ui,sans-serif;
  padding:2.5rem 1.5rem 4rem;
}
main{max-width:720px; margin:0 auto}
h1{font-family:"Sora",sans-serif; font-weight:800; font-size:1.9rem; margin:0 0 .3rem; text-wrap:balance}
.sub{color:var(--ink-dim); font-size:.95rem; margin:0 0 2.4rem}
a{color:var(--accent)}
.day{margin-bottom:2.2rem}
.day h2{
  font-family:"Sora",sans-serif; font-weight:700; font-size:1rem;
  color:var(--ink-dim); margin:0 0 .8rem; letter-spacing:.02em;
}
.entry{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:.7rem .95rem; margin-bottom:.5rem; font-size:.9rem; line-height:1.5;
}
footer{margin-top:3rem; font-size:.8rem; color:var(--ink-dim)}
</style>
</head>
<body>

<main>
  <h1>Changelog</h1>
  <p class="sub">Every change to <a href="index.html">Groundcheck</a>, most recent first, loaded live from its GitHub commits.</p>

  <div id="live"><div class="entry">Loading the latest commits&hellip;</div></div>
  <p style="text-align:center;margin:1.5rem 0"><button id="older" hidden style="font:inherit;padding:.5rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:inherit;cursor:pointer">Show older</button></p>
</main>
<script>
// The changelog is the list of commits of the repository. Our server fetches them from GitHub (with a key, kept for
// 15 minutes) and hands them out as JSON at /api/changelog. If our server cannot be reached, GitHub is asked directly.
(function(){
  var box = document.getElementById('live'), more = document.getElementById('older');
  var API = 'https://grants-governmental-wma-out.trycloudflare.com/api/changelog';
  var all = [], page = 1, PER = 100;
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function skip(msg){ return /^(Update|Add) (tunnel|accuracy|predictor|api)/i.test(msg); }
  function render(){
    var days = {}, order = [];
    all.forEach(function(c){
      var key = new Date(c.date).toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
      if (!days[key]) { days[key] = []; order.push(key); }
      days[key].push('<div class="entry"><a href="' + esc(c.url) + '" target="_blank" rel="noopener" style="color:inherit">' + esc(c.message) + '</a></div>');
    });
    box.innerHTML = order.map(function(k){ return '<div class="day"><h2>' + esc(k) + '</h2>' + days[k].join('') + '</div>'; }).join('') || '<div class="entry">Nothing to show right now.</div>';
  }
  function viaServer(){
    return fetch(API + '?page=' + page).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function viaGitHub(){
    return fetch('https://api.github.com/repos/Luishae07/groundcheck/commits?per_page=' + PER + '&page=' + page, {headers:{'Accept':'application/vnd.github+json'}})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(raw){
        return { more: raw.length >= PER, commits: raw.map(function(c){ return {message:(c.commit.message||'').split('\n')[0].trim(), date:c.commit.author.date, url:c.html_url}; }).filter(function(c){ return c.message && !skip(c.message); }) };
      });
  }
  function load(){
    more.disabled = true;
    return viaServer().catch(viaGitHub).then(function(d){
      all = all.concat(d.commits); render(); more.hidden = !d.more; more.disabled = false; page++;
    }).catch(function(){
      if (!all.length) box.innerHTML = '<div class="entry">Could not load the commits right now. Try again in a minute.</div>';
      more.disabled = false;
    });
  }
  more.addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
