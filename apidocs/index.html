<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API docs: Flowapi</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--mut:#5b6672;--acc:#2a6df4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--fg:#e8ecf1;--mut:#9aa6b3;--acc:#6ea0ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px}
h1{margin:0 0 8px}p{color:var(--mut);margin:6px 0}a{color:var(--acc)}
</style>
</head>
<body>
<div>
  <h1>Flowapi</h1>
  <p>One key for Groundcheck, Wikeutral, Flowmaps and Flowearth.</p>
  <p id="msg">Taking you to the docs…</p>
  <p><a id="go" href="https://github.com/Luishae07/groundcheck/blob/main/api-url.txt">Find the current address</a></p>
  <noscript><p>Open <a href="https://github.com/Luishae07/groundcheck/blob/main/api-url.txt">api-url.txt</a> to see the current Flowapi address.</p></noscript>
</div>
<script>
(async function () {
  var u = "";
  try {
    u = (await (await fetch("https://raw.githubusercontent.com/Luishae07/groundcheck/HEAD/api-url.txt?" + Date.now(), {cache: "no-store"})).text()).trim().split("\n")[0].replace(/\/$/, "");
  } catch (e) {}
  if (!/^https:\/\//.test(u)) { try { u = localStorage.getItem("flowapi-addr") || ""; } catch (e) {} }
  if (!/^https:\/\//.test(u)) { document.getElementById("msg").textContent = "I could not find the address right now."; return; }
  try { localStorage.setItem("flowapi-addr", u); } catch (e) {}
  document.getElementById("go").href = u + "/";
  document.getElementById("go").textContent = u;
  location.replace(u + "/");
})();
</script>
</body>
</html>
