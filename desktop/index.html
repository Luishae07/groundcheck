<!doctype html>
<meta charset="utf-8">
<title>Groundcheck — Desktop</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
:root{
  --sky-top:#4a7fb5; --sky-mid:#6ea0c8; --sky-bot:#a9cbe3;
  --panel:#ffffff; --panel-2:#f2f6f9; --ink:#132433; --ink-dim:#5b7185; --ink-faint:#8b9db0;
  --line:#dbe4ec; --accent:#1f6f4a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#0c1a2b; --sky-mid:#152b40; --sky-bot:#1f3a52;
    --panel:#141f2a; --panel-2:#0a121a; --ink:#e8eef4; --ink-dim:#8fa3b8; --ink-faint:#5d7285;
    --line:#22323f; --accent:#5fcf95;
  }
}
:root[data-theme="dark"]{
  --sky-top:#0c1a2b; --sky-mid:#152b40; --sky-bot:#1f3a52;
  --panel:#141f2a; --panel-2:#0a121a; --ink:#e8eef4; --ink-dim:#8fa3b8; --ink-faint:#5d7285;
  --line:#22323f; --accent:#5fcf95;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--panel-2); color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  display:grid;
  grid-template-columns:76px 1fr;
  grid-template-rows:64px 1fr;
  grid-template-areas:"side top" "side main";
  height:100vh;
}

/* --- top bar --- */
.topbar{
  grid-area:top;
  display:flex; align-items:center; gap:.9rem;
  padding:0 1.5rem;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.topbar .brand{font-family:"Sora",sans-serif; font-weight:800; font-size:1.05rem}
.topbar .live{display:flex; align-items:center; gap:.4rem; font-size:.78rem; color:var(--ink-dim); margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:#3ea86b;box-shadow:0 0 0 3px rgba(62,168,107,.2)}
.topbar a.mobilelink{font-size:.8rem; color:var(--ink-dim); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:.35rem .7rem}
.topbar a.mobilelink:hover{color:var(--ink)}

/* --- sidebar --- */
.sidebar{
  grid-area:side;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:stretch;
  padding:1rem 0;
  gap:.2rem;
}
.navbtn{
  display:flex; flex-direction:column; align-items:center; gap:.3rem;
  padding:.8rem 0; margin:0 .5rem; border-radius:12px;
  background:none; border:none; color:var(--ink-faint); font-family:inherit; font-size:.68rem;
  cursor:pointer;
}
.navbtn svg{width:22px;height:22px}
.navbtn:hover{background:var(--panel-2)}
.navbtn.active{color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent)}

/* --- main --- */
main{
  grid-area:main;
  overflow-y:auto;
  padding:1.6rem 2rem 3rem;
}
.wrap{max-width:1180px; margin:0 auto}

.hero{
  background:linear-gradient(120deg,var(--sky-top),var(--sky-mid) 55%,var(--sky-bot));
  border-radius:20px;
  color:#fff;
  padding:1.8rem 2rem;
  display:flex;
  align-items:center;
  gap:2.2rem;
  flex-wrap:wrap;
  margin-bottom:1.6rem;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse 50% 60% at 90% 0%, rgba(255,255,255,.2), transparent 60%);
}
.hero .icon svg{width:96px;height:96px; display:block}
.hero .readout{display:flex; flex-direction:column; gap:.15rem; position:relative}
.hero .temp{font-family:"Sora",sans-serif; font-weight:800; font-size:4.2rem; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.hero .loc{font-size:1.05rem; font-weight:600}
.hero .cond{font-size:.92rem; opacity:.9}
.hero .stamp{font-size:.78rem; opacity:.7; margin-top:.2rem}
.hero .metrics{display:flex; gap:1.6rem; margin-left:auto; position:relative; flex-wrap:wrap}
.hero .metric{display:flex; flex-direction:column; gap:.15rem; min-width:80px}
.hero .metric .k{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; opacity:.75}
.hero .metric .v{font-family:"Sora",sans-serif; font-weight:700; font-size:1.3rem; font-variant-numeric:tabular-nums}
.locbtn{
  position:relative;
  display:flex; align-items:center; gap:.4rem;
  padding:.55rem 1rem; border-radius:999px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35);
  color:#fff; font-family:inherit; font-size:.8rem; cursor:pointer;
  align-self:flex-start;
}
.locbtn:hover{background:rgba(255,255,255,.26)}
.locbtn svg{width:15px;height:15px}
.locbtn.spinning svg{animation:locspin .8s linear infinite}
@keyframes locspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .locbtn.spinning svg{animation:none} }

.grid3{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:1.4rem;
  align-items:start;
}
@media (max-width:900px){ .grid3{grid-template-columns:1fr} }

.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:1.2rem 1.3rem;
}
.panel h2{font-family:"Sora",sans-serif; font-size:.95rem; margin:0 0 .9rem; display:flex; align-items:baseline; gap:.5rem}
.panel h2 .n{font-size:.72rem; font-weight:400; color:var(--ink-faint)}

#mapbox{ height:420px; border-radius:12px; overflow:hidden; border:1px solid var(--line) }

.cardgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:.7rem;
}
.stationcard{
  background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
  padding:.8rem .9rem; cursor:pointer; text-align:left; font-family:inherit; color:inherit;
  display:flex; flex-direction:column; gap:.4rem;
}
.stationcard:hover{border-color:var(--accent)}
.stationcard .row1{display:flex; align-items:center; justify-content:space-between}
.stationcard svg{width:26px;height:26px}
.stationcard .id{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.72rem; color:var(--ink-dim)}
.stationcard .t{font-family:"Sora",sans-serif; font-weight:700; font-size:1.3rem}
.stationcard .meta{font-size:.72rem; color:var(--ink-faint)}

.dotmarker{
  width:14px;height:14px;
  border-radius:50%;
  background:var(--mc);
  border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.clusterdot{
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(31,111,74,.85);
  border:2px solid #fff;
  color:#fff;
  font-family:"Sora",sans-serif;
  font-weight:700;
  font-size:.78rem;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.leaflet-popup-content-wrapper{background:var(--panel); color:var(--ink); border-radius:12px}
.leaflet-popup-tip{background:var(--panel)}

footer{margin-top:2rem; font-size:.78rem; color:var(--ink-faint); text-align:center}
footer a{color:inherit}
</style>

<div class="topbar">
  <span class="brand">Groundcheck</span>
  <a class="mobilelink" href="../">Mobile view</a>
  <span class="live"><span class="dot"></span><span id="feedstatus">live feed</span></span>
</div>

<nav class="sidebar">
  <button class="navbtn active" data-view="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    Today
  </button>
  <button class="navbtn" data-view="stations">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
    Stations
  </button>
  <button class="navbtn" data-view="faq">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></svg>
    FAQ
  </button>
</nav>

<main>
  <div class="wrap">
    <div class="hero" id="hero"></div>

    <div id="view-today">
      <div class="grid3">
        <div class="panel">
          <h2>Station map <span class="n" id="mapCount"></span></h2>
          <div id="mapbox"></div>
        </div>
        <div class="panel">
          <h2>Last 7 days <span class="n" id="weekCount"></span></h2>
          <div class="cardgrid" id="weekGrid"></div>
        </div>
      </div>
    </div>

    <div id="view-stations" hidden>
      <div class="panel">
        <h2>All stations <span class="n" id="stationCount"></span></h2>
        <div class="cardgrid" id="stationGrid"></div>
      </div>
    </div>

    <div id="view-faq" hidden>
      <div class="panel">
        <h2>FAQ</h2>
        <p style="color:var(--ink-dim);line-height:1.6">See the full FAQ on the <a href="../">mobile view</a> — same content, same data.</p>
      </div>
    </div>

    <footer>Source: sonde.mine.nu ground telemetry &middot; sub-zero (high-altitude) readings excluded &middot; <a href="../apidocs/">API docs</a></footer>
  </div>
</main>

<script>
function iconFor(temp, hum, pressure){
  const stormy = hum !== null && hum > 90 && pressure != null && pressure < 985;
  const raining = hum !== null && hum > 92;
  const showery = hum !== null && hum > 85;
  if (stormy){
    return `<svg viewBox="0 0 64 64" fill="none"><path d="M16 38a11 11 0 1 1 2-21.8A14 14 0 0 1 44 20a10 10 0 0 1-1 18H16Z" fill="#9aa8b8"/><path d="M16 38a11 11 0 1 1 2-21.8A14 14 0 0 1 44 20a10 10 0 0 1-1 18H16Z" stroke="#5d7285" stroke-width="1.5"/><path d="M34 40 25 52h8l-5 12 15-16h-8l6-8Z" fill="#ffcc4d" stroke="#e0a412" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  }
  if (raining){
    return `<svg viewBox="0 0 64 64" fill="none"><path d="M18 40a11 11 0 1 1 2-21.8A14 14 0 0 1 46 22a10 10 0 0 1-1 18H18Z" fill="#c7d3dd"/><path d="M18 40a11 11 0 1 1 2-21.8A14 14 0 0 1 46 22a10 10 0 0 1-1 18H18Z" stroke="#8fa3b8" stroke-width="1.5"/><g stroke="#4f8fd6" stroke-width="3" stroke-linecap="round"><line x1="21" y1="46" x2="17" y2="56"/><line x1="32" y1="46" x2="28" y2="56"/><line x1="43" y1="46" x2="39" y2="56"/></g></svg>`;
  }
  if (temp >= 11 && !showery){
    return `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="15" fill="#ffb43c"/><g stroke="#ffb43c" stroke-width="3" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="60"/><line x1="4" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="60" y2="32"/><line x1="12" y1="12" x2="17.5" y2="17.5"/><line x1="46.5" y1="46.5" x2="52" y2="52"/><line x1="52" y1="12" x2="46.5" y2="17.5"/><line x1="17.5" y1="46.5" x2="12" y2="52"/></g></svg>`;
  }
  if (showery){
    return `<svg viewBox="0 0 64 64" fill="none"><path d="M20 44a11 11 0 1 1 2-21.8A14 14 0 0 1 48 26a10 10 0 0 1-1 18H20Z" fill="#e7edf2"/><path d="M20 44a11 11 0 1 1 2-21.8A14 14 0 0 1 48 26a10 10 0 0 1-1 18H20Z" stroke="#c3d0da" stroke-width="1.5"/><g stroke="#7fb3e0" stroke-width="2.5" stroke-linecap="round"><line x1="24" y1="50" x2="21" y2="57"/><line x1="34" y1="50" x2="31" y2="57"/><line x1="44" y1="50" x2="41" y2="57"/></g></svg>`;
  }
  if (temp >= 4){
    return `<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="30" r="10" fill="#ffb43c"/><path d="M24 44a11 11 0 1 1 2-21.8A14 14 0 0 1 52 26a10 10 0 0 1-1 18H24Z" fill="#e7edf2"/><path d="M24 44a11 11 0 1 1 2-21.8A14 14 0 0 1 52 26a10 10 0 0 1-1 18H24Z" stroke="#c3d0da" stroke-width="1.5"/></svg>`;
  }
  return `<svg viewBox="0 0 64 64" fill="none"><path d="M20 40a11 11 0 1 1 2-21.8A14 14 0 0 1 48 22a10 10 0 0 1-1 18H20Z" fill="#dbe3ea"/><path d="M20 40a11 11 0 1 1 2-21.8A14 14 0 0 1 48 22a10 10 0 0 1-1 18H20Z" stroke="#b7c6d3" stroke-width="1.5"/><g fill="#7fb3e0"><circle cx="24" cy="50" r="2.4"/><circle cx="34" cy="54" r="2.4"/><circle cx="44" cy="50" r="2.4"/></g></svg>`;
}
function condFor(temp, hum, pressure){
  if (hum !== null && hum > 90 && pressure != null && pressure < 985) return "Thunderstorms possible";
  if (hum !== null && hum > 92) return "Rain likely";
  if (hum !== null && hum > 85) return "Showers possible";
  if (temp >= 11) return "Clear";
  if (temp >= 4) return "Partly cloudy";
  return "Cool, cloudy";
}
function fmtTime(iso){
  return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function tempColor(t){
  if (t < 3) return '#3b82c4';
  if (t < 7) return '#2f9e6f';
  if (t < 11) return '#c99a2e';
  return '#c05a3c';
}

let points = [];
let leafletMap = null;
let leafletMarkerLayer = null;

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function locateByIP(){
  return fetch('https://ipwho.is/')
    .then(r => r.json())
    .then(d => {
      if (!d.success || d.latitude == null || d.longitude == null) throw new Error('no ip location');
      return { lat: d.latitude, lon: d.longitude, label: [d.city, d.country].filter(Boolean).join(', ') };
    });
}

function renderHero(p, distanceKm, label){
  let locLine, sub;
  if (distanceKm != null){
    locLine = 'Nearest station: ' + p.id;
    sub = distanceKm < 60
      ? distanceKm.toFixed(0) + ' km from you'
      : '⚠ ' + distanceKm.toFixed(0) + ' km away — nothing closer reported in the last 7 days';
    if (label) sub += ' &middot; approx. from ' + label;
  } else {
    locLine = 'Newest reading: station ' + p.id;
    sub = p.lat.toFixed(2) + ', ' + p.lon.toFixed(2);
  }

  document.getElementById('hero').innerHTML = `
    <div class="icon">${iconFor(p.temp, p.humidity, p.pressure)}</div>
    <div class="readout">
      <div class="loc">${locLine}</div>
      <div class="temp">${p.temp.toFixed(1)}&deg;</div>
      <div class="cond">${condFor(p.temp, p.humidity, p.pressure)}</div>
      <div class="stamp">${sub} &middot; ${fmtTime(p.time)}</div>
    </div>
    <div class="metrics">
      <div class="metric"><span class="k">Humidity</span><span class="v">${p.humidity != null ? p.humidity + '%' : '—'}</span></div>
      <div class="metric"><span class="k">Pressure</span><span class="v">${p.pressure != null ? p.pressure + ' hPa' : '—'}</span></div>
      <div class="metric"><span class="k">Altitude</span><span class="v">${Math.round(p.alt)} m</span></div>
      <div class="metric"><span class="k">Stations</span><span class="v">${points.length}</span></div>
    </div>
    <button class="locbtn" id="locBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      Use my location
    </button>
  `;
  document.getElementById('locBtn').addEventListener('click', locate);
}

let lastLoc = null;

function selectNearest(lat, lon, label){
  const FRESH_HOURS = 24;
  const cutoff = Date.now() - FRESH_HOURS * 3600 * 1000;
  const fresh = points.filter(p => new Date(p.time).getTime() >= cutoff);
  const pool = fresh.length ? fresh : points;

  let nearest = pool[0], best = Infinity;
  for (const p of pool){
    const d = haversine(lat, lon, p.lat, p.lon);
    if (d < best){ best = d; nearest = p; }
  }
  renderHero(nearest, best, label);
}

function locate(){
  const btn = document.getElementById('locBtn');
  if (!points.length) return;
  if (btn) btn.classList.add('spinning');

  const finishWith = (lat, lon, label) => {
    lastLoc = { lat, lon, label };
    selectNearest(lat, lon, label);
  };

  const fallbackToIP = () => {
    locateByIP()
      .then(loc => finishWith(loc.lat, loc.lon, loc.label))
      .catch(() => { if (btn) btn.classList.remove('spinning'); });
  };

  if (!navigator.geolocation || !window.isSecureContext){
    fallbackToIP();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => finishWith(pos.coords.latitude, pos.coords.longitude, null),
    fallbackToIP,
    { timeout: 8000 }
  );
}

function stationCard(p){
  const color = tempColor(p.temp);
  return `
    <button class="stationcard" data-id="${p.id}">
      <div class="row1">${iconFor(p.temp, p.humidity, p.pressure)}<span class="t" style="color:${color}">${p.temp.toFixed(1)}&deg;</span></div>
      <div class="id">${p.id}</div>
      <div class="meta">${fmtTime(p.time)} &middot; ${Math.round(p.alt)} m alt</div>
    </button>
  `;
}

function renderMap(list){
  document.getElementById('mapCount').textContent = list.length + ' stations';
  if (!leafletMap){
    leafletMap = L.map('mapbox', {
      zoomControl: true, attributionControl: false, preferCanvas: true,
      worldCopyJump: false,
      maxBounds: [[-90, -180], [90, 180]],
      maxBoundsViscosity: 1.0,
      minZoom: 2
    }).setView([51.5, 10.5], 5);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, noWrap: true }).addTo(leafletMap);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, noWrap: true, opacity:.85 }).addTo(leafletMap);
    L.control.attribution({ prefix:false, position:'bottomright' }).addAttribution('Tiles &copy; Esri').addTo(leafletMap);
  }
  if (leafletMarkerLayer) leafletMap.removeLayer(leafletMarkerLayer);

  leafletMarkerLayer = L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    disableClusteringAtZoom: 12,
    iconCreateFunction: cluster => {
      const n = cluster.getChildCount();
      const size = n < 10 ? 30 : n < 50 ? 38 : 46;
      return L.divIcon({
        html: `<div class="clusterdot" style="width:${size}px;height:${size}px">${n}</div>`,
        className: '',
        iconSize: [size, size]
      });
    }
  });

  list.forEach(p => {
    const color = tempColor(p.temp);
    const marker = L.marker([p.lat, p.lon], {
      icon: L.divIcon({
        className: '',
        html: `<div class="dotmarker" style="--mc:${color}"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      })
    });
    marker.bindPopup(() => `<b>${p.temp.toFixed(1)}&deg;C</b><br>${p.id}<br>${fmtTime(p.time)}`);
    leafletMarkerLayer.addLayer(marker);
  });

  leafletMap.addLayer(leafletMarkerLayer);
  if (list.length) leafletMap.fitBounds(L.latLngBounds(list.map(p => [p.lat, p.lon])), { padding:[24,24] });
}

function wireCardClicks(container){
  container.querySelectorAll('.stationcard').forEach(card => {
    card.addEventListener('click', () => {
      const p = points.find(pt => pt.id === card.dataset.id);
      if (p) renderHero(p);
      document.querySelector('.navbtn[data-view="today"]').click();
    });
  });
}

function render(){
  if (!points.length) return;
  if (lastLoc){
    selectNearest(lastLoc.lat, lastLoc.lon, lastLoc.label);
  } else {
    renderHero(points[0]);
    locate();
  }

  const byDay = new Map();
  for (const p of points){
    const day = p.time.slice(0,10);
    const cur = byDay.get(day);
    if (!cur || p.temp > cur.temp) byDay.set(day, p);
  }
  const days = [...byDay.values()].sort((a,b) => b.tsunix - a.tsunix).slice(0,7);
  document.getElementById('weekCount').textContent = days.length + ' days';
  const weekGrid = document.getElementById('weekGrid');
  weekGrid.innerHTML = days.map(stationCard).join('');
  wireCardClicks(weekGrid);

  // The map lives directly on the default-visible Today panel, so it has
  // to render right away — only the Stations grid (a separate tab that
  // isn't shown until clicked) benefits from being deferred.
  renderMap(points);
  freshStationsGrid = false;
}

let freshStationsGrid = false;

function renderHeavyViewsIfNeeded(view){
  if (view !== 'stations' || freshStationsGrid) return;
  freshStationsGrid = true;

  document.getElementById('stationCount').textContent = points.length + ' stations';
  const stationGrid = document.getElementById('stationGrid');
  stationGrid.innerHTML = points.map(stationCard).join('');
  wireCardClicks(stationGrid);
}

document.querySelectorAll('.navbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('main [id^="view-"]').forEach(v => v.hidden = true);
    document.getElementById('view-' + btn.dataset.view).hidden = false;
    renderHeavyViewsIfNeeded(btn.dataset.view);
    if (btn.dataset.view === 'today' && leafletMap) setTimeout(() => leafletMap.invalidateSize(), 50);
  });
});

function loadData(){
  fetch('https://senate-armed-detector-farmers.trycloudflare.com/api/data')
    .then(r => r.json())
    .then(data => { points = data; render(); })
    .catch(() => { document.getElementById('feedstatus').textContent = 'feed unreachable'; });
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
