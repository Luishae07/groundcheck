<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groundcheck for Apple Watch</title>
<meta name="description" content="A tiny Groundcheck page for watch screens: the temperature measured by the weather balloon nearest to you.">
<link rel="canonical" href="https://luishae07.github.io/applewatch/">
<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="https://luishae07.github.io/logo.svg">
<style>
html,body{margin:0;padding:0;background:#000;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 6px;box-sizing:border-box;-webkit-text-size-adjust:100%}
#where{font-size:15px;line-height:1.2;color:#9fd2ff;font-weight:600;margin:0 0 2px;word-break:break-word}
#temp{font-family:inherit;font-size:56px;font-size:clamp(44px,30vw,110px);font-weight:300;line-height:1;color:#fff;background:none;border:0;padding:0;margin:2px 0;cursor:pointer;-webkit-appearance:none;appearance:none}
#sub{font-size:14px;line-height:1.25;color:#cfd6dd;margin:2px 0}
#more{font-size:13px;line-height:1.25;color:#8d98a3;margin:2px 0}
#msg{font-size:15px;line-height:1.3;color:#cfd6dd;margin:0}
#chg{font-size:13px;color:#7cc4ff;text-decoration:none;display:inline-block;margin:6px 0 2px;padding:4px 8px}
#cities{width:100%;margin:6px 0 0}
#cities button{display:block;width:100%;box-sizing:border-box;margin:4px 0;padding:10px 6px;font:inherit;font-size:16px;color:#fff;background:#1c2330;border:0;border-radius:12px;cursor:pointer}
#cities button.auto{color:#9fd2ff;background:#10151d}
#foot{font-size:11px;color:#6b7580;margin-top:8px}
#foot a{color:#7cc4ff;text-decoration:none}
</style>
</head>
<body>
<p id="where"></p>
<button id="temp" type="button" title="Tap to switch between °C and °F" hidden></button>
<p id="sub"></p>
<p id="more"></p>
<p id="msg">Loading…</p>
<a id="chg" href="#">Change place</a>
<div id="cities" hidden></div>
<noscript><p style="font-size:15px;line-height:1.3;color:#cfd6dd">This page needs JavaScript. Open <a href="https://luishae07.github.io/" style="color:#7cc4ff">luishae07.github.io</a> on your iPhone.</p></noscript>
<p id="foot"><a href="../">Groundcheck</a> &middot; real weather balloon data<br><a href="place.html">Set my place</a></p>
<script>
// A tiny page for watch screens. It asks the Groundcheck server for the readings of the last two days (about 18 KB),
// finds the balloon nearest to you and shows its temperature. Without a location from the device, your place is the server's rough guess from your
// network address (it is not stored), or from the address: ?lat=52.5&lon=13.4&name=Berlin  and  &units=f for Fahrenheit.
// The page first asks the device for its location; &gps=0 skips that and uses the network address only.
// A map link works too:  ?map=<a Google Maps or OpenStreetMap link>  (place.html turns a pasted link into a short watch link).
// A map link (Google Maps, OpenStreetMap ...) in the address:  ?map=<link>  gives the place. The same code is in place.html.
function parseMapLink(raw) {
  var t = String(raw || '').trim();
  for (var i = 0; i < 2; i++) { try { t = decodeURIComponent(t); } catch (e) { break; } }
  var num = '(-?\\d{1,3}(?:\\.\\d+)?)';
  var m, best = null, centre = null;
  m = new RegExp('@' + num + ',' + num).exec(t);
  if (m) centre = [parseFloat(m[1]), parseFloat(m[2])];
  var pins = [], re = new RegExp('!3d' + num + '!4d' + num, 'g');
  while ((m = re.exec(t))) pins.push([parseFloat(m[1]), parseFloat(m[2])]);
  if (pins.length) {
    best = pins[pins.length - 1];
    if (centre) {
      var d = 1e18;
      pins.forEach(function (p) { var x = (p[0] - centre[0]) * (p[0] - centre[0]) + (p[1] - centre[1]) * (p[1] - centre[1]); if (x < d) { d = x; best = p; } });
    }
  } else if (centre) {
    best = centre;
  }
  if (!best && (m = new RegExp('[?&](?:q|ll|query|center|destination|daddr|sll)=' + num + '[ ,+]+' + num).exec(t))) best = [parseFloat(m[1]), parseFloat(m[2])];
  if (!best && (m = new RegExp('#map=\\d+/' + num + '/' + num).exec(t))) best = [parseFloat(m[1]), parseFloat(m[2])];
  if (!best && (m = new RegExp('mlat=' + num + '[^]*?mlon=' + num).exec(t))) best = [parseFloat(m[1]), parseFloat(m[2])];
  if (!best && (m = new RegExp('^\\s*' + num + '\\s*[,;\\s]\\s*' + num + '\\s*$').exec(t))) best = [parseFloat(m[1]), parseFloat(m[2])];
  if (!best || !isFinite(best[0]) || !isFinite(best[1]) || Math.abs(best[0]) > 90 || Math.abs(best[1]) > 180) return null;
  var name = '';
  if ((m = /\/maps\/place\/([^\/@?]+)/.exec(t))) name = m[1].replace(/\+/g, ' ').split(',')[0].trim();
  return { lat: best[0], lon: best[1], name: name.slice(0, 24) };
}

(function () {
  var POINTER = 'https://raw.githubusercontent.com/Luishae07/groundcheck/main/tunnel-url.txt';
  var LITE = '/apiinternel/dont/json/microsftwindowssucks/lite?days=2';
  var $ = function (id) { return document.getElementById(id); };

  var params = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    var p = kv.split('=');
    if (p[0]) params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
  });
  var CITIES = [['Berlin', 52.52, 13.405], ['Zeesen', 52.2724, 13.6325], ['K\u00f6nigs Wusterhausen', 52.2995, 13.6244], ['Potsdam', 52.3906, 13.0645], ['Hamburg', 53.5511, 9.9937], ['M\u00fcnchen', 48.1351, 11.582],
    ['K\u00f6ln', 50.9375, 6.9603], ['Frankfurt', 50.1109, 8.6821], ['Dresden', 51.0504, 13.7373], ['Leipzig', 51.3397, 12.3731],
    ['Wien', 48.2082, 16.3738], ['Z\u00fcrich', 47.3769, 8.5417], ['London', 51.5074, -0.1278], ['Paris', 48.8566, 2.3522],
    ['New York', 40.7128, -74.006], ['Los Angeles', 34.0522, -118.2437], ['Tokyo', 35.6762, 139.6503], ['Sydney', -33.8688, 151.2093]];
  function savedPlace() {
    try { var v = JSON.parse(localStorage.getItem('gc_place')); if (v && isFinite(v.lat) && isFinite(v.lon)) return v; } catch (e) {}
    return null;
  }
  function savePlace(v) { try { if (v) localStorage.setItem('gc_place', JSON.stringify(v)); else localStorage.removeItem('gc_place'); } catch (e) {} }
  var fahrenheit = String(params.units || '').toLowerCase() === 'f';
  var shown = null;

  function ajax(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 25000;
    x.onload = function () { x.status >= 200 && x.status < 300 ? cb(null, x.responseText) : cb(new Error('HTTP ' + x.status)); };
    x.onerror = x.ontimeout = function () { cb(new Error('network')); };
    x.send();
  }

  function km(lat1, lon1, lat2, lon2) {
    var r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 12742 * Math.asin(Math.sqrt(a));
  }

  function age(ts) {
    var s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 90 * 60) return Math.max(1, Math.round(s / 60)) + ' min ago';
    if (s < 48 * 3600) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' days ago';
  }

  function fail(text) {
    if (shown) return; // keep showing the last good reading
    $('temp').hidden = true;
    $('where').textContent = $('sub').textContent = $('more').textContent = '';
    $('msg').textContent = text;
  }

  function draw() {
    if (!shown) return;
    var t = fahrenheit ? shown.temp * 9 / 5 + 32 : shown.temp;
    $('temp').textContent = (Math.round(t * 10) / 10).toFixed(1).replace(/\.0$/, '') + '°' + (fahrenheit ? 'F' : '');
    $('temp').hidden = false;
    $('where').textContent = shown.name || '';
    $('sub').textContent = 'Balloon ' + Math.round(shown.dist) + ' km away · ' + age(shown.ts);
    var more = [];
    if (shown.pressure != null) more.push(Math.round(shown.pressure) + ' hPa');
    if (shown.humidity != null) more.push(Math.round(shown.humidity) + ' %');
    $('more').textContent = more.join(' · ');
    $('msg').textContent = '';
  }

  function viaNetwork(base, cb) {
    ajax(base + '/api/whereami', function (err, body) {
      if (err) return cb(null);
      try {
        var d = JSON.parse(body);
        if (d && d.success && isFinite(d.latitude) && isFinite(d.longitude)) return cb({ lat: d.latitude, lon: d.longitude, name: d.city || d.region || d.country || '' });
      } catch (e) {}
      cb(null);
    });
  }

  // 1. a place in the address, 2. the location of the device (asks once), 3. the server's rough guess from the network address
  function locate(base, cb) {
    var lat = parseFloat(String(params.lat).replace(',', '.')), lon = parseFloat(String(params.lon).replace(',', '.')); // a German iPhone writes 52,52
    if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return cb({ lat: lat, lon: lon, name: params.name || '' });
    var fromMap = params.map ? parseMapLink(params.map) : null;
    if (fromMap) return cb({ lat: fromMap.lat, lon: fromMap.lon, name: params.name || fromMap.name || '' });
    var sp = savedPlace();
    if (sp) return cb(sp);
    if (!navigator.geolocation || params.gps === '0') return viaNetwork(base, cb);
    if (!shown) $('msg').textContent = 'Asking for your location\u2026';
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; viaNetwork(base, cb); } }, 9000);
    navigator.geolocation.getCurrentPosition(function (p) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cb({ lat: p.coords.latitude, lon: p.coords.longitude, name: params.name || 'Your location' });
    }, function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      viaNetwork(base, cb);
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 10 * 60 * 1000 });
  }

  function showCities(show) { $('cities').hidden = !show; }
  function buildCities() {
    var box = $('cities');
    var auto = document.createElement('button');
    auto.type = 'button'; auto.className = 'auto'; auto.textContent = 'Find my place';
    auto.addEventListener('click', function () { savePlace(null); showCities(false); shown = null; start(); });
    box.appendChild(auto);
    CITIES.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = c[0];
      b.addEventListener('click', function () { savePlace({ lat: c[1], lon: c[2], name: c[0] }); showCities(false); shown = null; start(); });
      box.appendChild(b);
    });
  }
  $('chg').addEventListener('click', function (e) { e.preventDefault(); showCities($('cities').hidden); });
  buildCities();

  function start() {
    ajax(POINTER, function (err, text) {
      var base = (text || '').trim().replace(/\/$/, '');
      if (err || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(base)) return fail('Cannot reach Groundcheck right now.');
      locate(base, function (loc) {
        if (!loc) { showCities(true); return fail('Where are you? Tap a place:'); }
        ajax(base + LITE, function (err2, body) {
          if (err2) return fail('Cannot load the balloon readings.');
          var list;
          try { list = JSON.parse(body); } catch (e) { return fail('Cannot read the balloon readings.'); }
          var best = null;
          for (var i = 0; i < list.length; i++) {
            var r = list[i];
            if (!r || !isFinite(r.lat) || !isFinite(r.lon) || !isFinite(r.temp)) continue;
            var ts = r.tsunix || Date.parse(r.time) / 1000;
            var d = km(loc.lat, loc.lon, r.lat, r.lon);
            if (!best || d < best.dist - 1 || (Math.abs(d - best.dist) <= 1 && ts > best.ts)) {
              best = { dist: d, ts: ts, temp: r.temp, pressure: isFinite(r.pressure) ? r.pressure : null, humidity: isFinite(r.humidity) ? r.humidity : null };
            }
          }
          if (!best) return fail('No balloon readings in the last two days.');
          best.name = loc.name;
          shown = best;
          draw();
        });
      });
    });
  }

  $('temp').addEventListener('click', function () { fahrenheit = !fahrenheit; draw(); });
  start();
  setInterval(start, 10 * 60 * 1000);
})();
</script>
</body>
</html>
