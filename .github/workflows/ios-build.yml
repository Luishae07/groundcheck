name: Build iOS App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    # macos-26-arm64 is real but has very limited capacity (long queue times).
    # macos-15 is more available and still ships Xcode 26.x side-by-side with
    # its old default (16.4) - must select it explicitly, verified via
    # actions/runner-images' own published software manifest.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Show Xcode version
        run: xcodebuild -version

      # Real device target (generic arm64), not the Simulator — a Simulator
      # build isn't installable on an actual iPhone at all. Unsigned here;
      # iLoader/AltStore-style sideloading tools do their own signing on
      # install, so no Apple Developer certificate is needed in CI.
      - name: Build (Release, device, no code signing)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Groundcheck.xcodeproj \
            -scheme Groundcheck \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      # Package the built .app into the standard IPA layout (a zip with a
      # top-level Payload/ folder) so it can be uploaded/installed like any
      # normal IPA.
      - name: Package IPA
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Groundcheck.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Groundcheck-iOS
          path: ios/Groundcheck.ipa
          retention-days: 30
